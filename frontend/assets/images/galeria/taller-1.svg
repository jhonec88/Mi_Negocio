<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" rx="16" fill="#1E293B" />
  <!-- Mesa antiestática con osciloscopio y herramientas de precisión -->
  <rect x="50" y="100" width="500" height="250" rx="8" fill="#0F172A" stroke="#334155" stroke-width="3" />
  <rect x="80" y="130" width="160" height="110" rx="6" fill="#0284C7" />
  <!-- Onda de osciloscopio -->
  <path d="M90,185 Q115,130 140,185 T190,185 T230,185" fill="none" stroke="#FFFFFF" stroke-width="3" />
  <!-- Placa madre en diagnóstico -->
  <rect x="270" y="130" width="240" height="170" rx="6" fill="#047857" stroke="#065F46" stroke-width="2" />
  <rect x="330" y="160" width="60" height="60" fill="#334155" />
  <text x="300" y="380" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#94A3B8" text-anchor="middle">Laboratorio de Diagnóstico Electrónico</text>
</svg>