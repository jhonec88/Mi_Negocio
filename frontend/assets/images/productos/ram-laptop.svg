<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" rx="16" fill="#F8FAFC" />
  <!-- PCB SO-DIMM Verde/Azulado -->
  <rect x="90" y="90" width="220" height="120" rx="6" fill="#047857" stroke="#065F46" stroke-width="2" />
  <!-- Chips BGA -->
  <rect x="110" y="105" width="40" height="35" rx="3" fill="#1E293B" />
  <rect x="160" y="105" width="40" height="35" rx="3" fill="#1E293B" />
  <rect x="210" y="105" width="40" height="35" rx="3" fill="#1E293B" />
  <rect x="260" y="105" width="40" height="35" rx="3" fill="#1E293B" />
  <!-- Etiqueta Crucial -->
  <rect x="120" y="150" width="160" height="30" rx="3" fill="#FFFFFF" />
  <text x="200" y="170" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0284C7" text-anchor="middle">Crucial 16GB DDR4 SO-DIMM</text>
  <!-- Pines dorados laptop -->
  <rect x="95" y="200" width="95" height="8" fill="#F59E0B" />
  <rect x="205" y="200" width="100" height="8" fill="#F59E0B" />
  <text x="200" y="255" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Memoria RAM para Laptop 3200MHz</text>
</svg>