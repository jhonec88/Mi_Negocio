<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" rx="16" fill="#F8FAFC" />
  <!-- Conector HDMI metalico -->
  <polygon points="150,110 250,110 240,160 160,160" fill="#0F172A" stroke="#334155" stroke-width="2" />
  <rect x="170" y="70" width="60" height="40" fill="#F59E0B" rx="3" />
  <rect x="180" y="80" width="40" height="15" fill="#0F172A" />
  <text x="200" y="140" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">8K 60Hz</text>
  <!-- Cable trenzado -->
  <path d="M200,160 Q200,210 260,200 T300,240" fill="none" stroke="#1E293B" stroke-width="12" stroke-linecap="round" />
  <text x="200" y="270" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Cable HDMI 2.1 Ultra High Speed</text>
