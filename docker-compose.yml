services:
  db:
    image: postgres:16-alpine
    container_name: tecnofix_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tecnofix_db
      POSTGRES_USER: tecnofix_admin
      POSTGRES_PASSWORD: tecnofix_secure_pass_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tecnofix_admin -d tecnofix_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
